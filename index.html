<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Planet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="loading">
      <div id="loading-bg"></div>
      <div id="loading-frame">
        <div id="loading-emblem" aria-hidden="true"></div>
        <h1 id="loading-title">Voxel Planet</h1>
        <div id="loading-rule"></div>
        <div id="loading-sub">A procedural world, forged on the GPU</div>
        <div id="loading-bar"><span></span></div>
        <div id="loading-tip">Generating world&hellip;</div>
        <div id="loading-controls">WASD move &middot; Shift sprint &middot; F fly &middot; G drone &middot; Tab weather &middot; T time &middot; Esc release mouse</div>
        <div id="loading-enter">Click to enter</div>
      </div>
    </div>

    <div id="app"></div>

    <div id="crosshair"></div>
    <div id="click-hint">WASD move &nbsp;&middot;&nbsp; F fly &nbsp;&middot;&nbsp; G drone &nbsp;&middot;&nbsp; Shift sprint &nbsp;&middot;&nbsp; Tab weather &nbsp;&middot;&nbsp; T time</div>

    <div id="hud">
      <div id="hud-fps"></div>
      <div id="hud-seed"></div>
      <div id="hud-status"></div>
      <div id="hud-interact"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
